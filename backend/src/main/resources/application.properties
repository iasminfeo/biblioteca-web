spring.application.name=biblioteca-web
server.port=8080

# ===== Banco de dados: PostgreSQL 15 (biblioteca_db) =====
# No docker-compose estes valores sao sobrescritos pelas variaveis SPRING_DATASOURCE_*
spring.datasource.url=jdbc:postgresql://localhost:5432/biblioteca_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
# update: cria/atualiza as tabelas a partir das entidades (@Entity)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== Swagger (springdoc) =====
springdoc.swagger-ui.path=/swagger-ui.html
