name: CI/CD - Biblioteca Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ===== Backend: testes unitarios + integracao + cobertura (JaCoCo) =====
  test-backend:
    name: Testes do backend (Java 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Testes unitarios (*ControllerTest)
        run: mvn -B test -Dtest="*ControllerTest"

      - name: Teste de integracao (IntegracaoTest)
        run: mvn -B test -Dtest="IntegracaoTest"

      - name: Todos os testes + relatorio JaCoCo
        run: mvn -B test

      - name: Publicar relatorio de cobertura (JaCoCo)
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

  # ===== Frontend: testes Jest + build de producao =====
  test-frontend:
    name: Testes e build do frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Testes (Jest)
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true

      - name: Build de producao
        run: npm run build
        env:
          CI: true

  # ===== (extra) Deploy: build das imagens Docker + testes de aceitacao com curl =====
  # Roda so depois do merge na main. O deploy na AWS (ECR/ECS) nao e exigido.
  deploy:
    name: Docker + testes de aceitacao
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Build das imagens (docker compose build)
        run: docker compose build

      - name: Subir backend, frontend e postgres
        run: docker compose up -d

      - name: Aguardar o backend ficar pronto
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/api/autores > /dev/null; then
              echo "Backend no ar"; exit 0
            fi
            echo "Aguardando backend... ($i)"; sleep 5
          done
          docker compose logs backend
          exit 1

      - name: Testes de aceitacao (curl)
        run: |
          set -e
          echo "1) Cria um autor"
          AUTOR_ID=$(curl -sf -X POST http://localhost:8080/api/autores \
            -H "Content-Type: application/json" \
            -d '{"nome":"Machado de Assis","nacionalidade":"Brasileira","dataNascimento":"1839-06-21"}' | jq -r '.id')
          echo "Autor criado com id $AUTOR_ID"

          echo "2) Cria um livro vinculado ao autor"
          curl -sf -X POST http://localhost:8080/api/livros \
            -H "Content-Type: application/json" \
            -d "{\"titulo\":\"Dom Casmurro\",\"isbn\":\"978-8535910667\",\"anoPublicacao\":1899,\"genero\":\"Romance\",\"autor\":{\"id\":$AUTOR_ID}}" \
            | tee livro.json
          echo
          jq -e ".autor.id == $AUTOR_ID" livro.json

          echo "3) Lista os livros do autor"
          curl -sf http://localhost:8080/api/livros/autor/$AUTOR_ID | jq -e 'length == 1'

          echo "4) Frontend respondendo na porta 3000"
          curl -sf http://localhost:3000 | grep -q '<div id="root">'

      - name: Derrubar os containers
        if: always()
        run: docker compose down -v
